[project]
name = "crunchbench"
version = "0.2.0"
description = "Measures an LLM's ability to analyze unstructured data across context sizes"
readme = "readme.md"
requires-python = ">=3.12"
dependencies = [
    "ezvals>=0.1.10",
    "langsmith>=0.14.0",
    "matplotlib>=3.11.2",
    "openai>=3.19.2",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.3",
    "tiktoken>=0.14.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crunchbench"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
